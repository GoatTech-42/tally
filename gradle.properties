org.gradle.parallel=true
org.gradle.caching=true
# Loom remaps and decompiles Minecraft; the default heap is not enough.
org.gradle.jvmargs=-Xmx3G

# Minecraft mod targets — see https://fabricmc.net/develop/
# Minecraft 26.2 ships unobfuscated: no yarn, no Mojang mappings, no remapping.
# Building the mod requires JDK 25 (Minecraft 26.2 mandates it).
# IntelliJ is not yet compatible with the configuration cache under Loom.
org.gradle.configuration-cache=false

minecraft_version=1.21.11
loader_version=0.20.1
# Minimum loader the mod actually needs, declared separately from the version
# it is built against: nested-jar extraction to disk (which sqlite-jdbc's
# native loading depends on) has behaved this way since 0.16.x. Requiring the
# build-time version instead would lock out the stable loader.
loader_dependency=0.16.0
loom_version=1.19.3
fabric_api_version=0.141.6+1.21.11

# Minimum Java the mod jar declares it runs on: 21 for 1.21.x
# (bytecode target follows minecraft_version in trader-fabric/build.gradle),
# 25 on the 26.x line.
java_dependency=>=21
