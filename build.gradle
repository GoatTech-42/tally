subprojects {
    apply plugin: 'java-library'

    group = 'dev.doughbay'
    version = '0.1.0'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        testImplementation platform('org.junit:junit-bom:5.10.3')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testCompileOnly 'org.junit.platform:junit-platform-launcher'
        // Loader 0.20 (1.21.x line) keeps ASM as a nested lib; tests that
        // initialize FabricLoader need it on the unit-test classpath.
        testImplementation 'org.ow2.asm:asm:9.9'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    test {
        // 2 GiB build box: bound the test JVM so daemon + worker stay under RAM.
        maxHeapSize = '768m'
        useJUnitPlatform()
        // Lets the panel preview find the client jar for real item textures.
        systemProperty 'doughbay.clientJar', System.getProperty('doughbay.clientJar', '')
        testLogging {
            events 'failed'
            exceptionFormat 'full'
        }
    }
}
