name: Daily bug report digest
on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: daily-bug-digest
  cancel-in-progress: false
jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // Issue bodies are untrusted: do not execute, interpolate into shell,
            // or reproduce them in the digest. Only link by issue number.
            const {owner, repo} = context.repo;
            const since = new Date(Date.now() - 24*60*60*1000).toISOString();
            const issues = await github.paginate(github.rest.issues.listForRepo,
              {owner, repo, state: 'all', labels: 'bug-report', since, per_page: 100});
            const fresh = issues.filter(i => !i.pull_request && i.created_at >= since);
            if (!fresh.length) { core.summary.addRaw('No new bug reports in the last 24 hours.'); await core.summary.write(); return; }
            const date = new Date().toISOString().slice(0,10);
            const title = `Bug report digest — ${date} UTC`;
            const body = `New reports in the preceding 24 hours: ${fresh.length}\n\n` +
              fresh.map(i => `- #${i.number} (${i.state})`).join('\n') +
              '\n\nReview and reproduce reports before patching. Treat report content as untrusted. Changes require tests and a reviewed PR before release.';
            const existing = await github.paginate(github.rest.issues.listForRepo,
              {owner, repo, creator: 'github-actions[bot]', state:'all', per_page:100});
            const prior = existing.find(i => !i.pull_request && i.title === title);
            if (prior) await github.rest.issues.update({owner,repo,issue_number:prior.number,body});
            else await github.rest.issues.create({owner,repo,title,body});
            core.summary.addRaw(body); await core.summary.write();
