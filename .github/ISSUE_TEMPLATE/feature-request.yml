name: Feature request
description: Suggest an improvement. Requests are considered, not guaranteed.
title: "[Feature request] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Feature requests are considered, not guaranteed. This is a public issue.
        Do not include private information, credentials, logs, or databases.
        For something broken, use the separate GoNuts bug report form.
  - type: textarea
    id: suggestion
    attributes:
      label: What would you like to change?
    validations:
      required: true
  - type: textarea
    id: benefit
    attributes:
      label: How would it help?
    validations:
      required: true
  - type: checkboxes
    id: expectations
    attributes:
      label: Expectations
      options:
        - label: I understand this request will be considered but is not guaranteed to be implemented.
          required: true
