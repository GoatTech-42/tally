name: GoNuts bug report
description: Paste the privacy-filtered report prepared in GoNuts About → Report bug.
title: "[Bug report] "
labels: [bug-report]
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Review everything before submitting. Do not attach raw logs,
        settings, databases, tokens, private chat, or personal information.
        In GoNuts: About → Report bug → Prepare private report → Copy + open GitHub.
  - type: textarea
    id: report
    attributes:
      label: Reviewed GoNuts report
      description: Paste the prepared report here and remove any remaining private information.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed this report and removed private information. I understand this issue is public.
          required: true
